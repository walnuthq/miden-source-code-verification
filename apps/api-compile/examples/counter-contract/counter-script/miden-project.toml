[package]
name = "counter-script"
version = "0.1.0"

[lib]
kind = "tx-script"
# The toolchain requires every `tx-script` project to declare this namespace.
namespace = "miden:base/transaction-script@1.0.0"
path = "src/lib.rs"

[dependencies]
miden-core = "*"
miden-protocol = "*"
counter-contract = { path = "../counter-contract" }

[package.metadata.miden.dependencies]
counter-contract = { wit = "../counter-contract/target/generated-wit/" }
