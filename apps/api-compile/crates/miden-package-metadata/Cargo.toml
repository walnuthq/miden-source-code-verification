[package]
name = "miden-package-metadata"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# The VM crates of the 0.18 protocol, which read the packages
# `miden-assembly` 0.36 builds. They don't derive `serde` for the manifest, so
# `main.rs` writes the JSON itself, and `miden-assembly-syntax` supplies the
# types it walks.
miden-assembly-syntax = "=0.36.5"
miden-mast-package = "=0.36.5"
# For `read_only.rs`: the MAST node types, and the libraries a package calls
# into. A call whose digest isn't in them doesn't resolve, which makes its
# caller `null` (can't be told), never a wrong `true` or `false`. Already in
# the workspace's lockfile through `miden-client`, at these versions.
miden-core = "=0.36.5"
miden-core-lib = "=0.36.5"
miden-protocol = "=0.18.0"
# For `source_parameters.rs`: loads a MASM project's manifest to find its
# library's root module. Already in the lockfile through `miden-assembly`.
miden-project = "=0.36.5"
miden-standards = "=0.18.0"
miden-serde-utils = "=0.36.5"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# For `tests/masm_packages.rs`, which assembles `miden-assemble`'s test
# projects as that tool does. Already in the lockfile, at these versions.
miden-assembly = "=0.36.5"
miden-package-registry = "=0.36.5"
