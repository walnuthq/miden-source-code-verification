[package]
name = "miden-package-metadata"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# The VM crates of the 0.17 toolchain: `cargo-miden 0.11.0` writes its packages
# against these. They no longer derive `serde` for the manifest, so `main.rs`
# writes the JSON itself, and `miden-assembly-syntax` supplies the types it walks.
miden-assembly-syntax = "=0.35.0"
miden-mast-package = "=0.35.0"
miden-serde-utils = "=0.35.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
