[package]
name = "miden-import"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
miden-client = { version = "=0.17.4", features = ["tonic", "testing"] }
# No 0.17.4 release; 0.17.3 accepts `miden-client ^0.17`.
miden-client-sqlite-store = { version = "=0.17.3", package = "miden-client-sqlite-store" }
miden-standards = { version = "=0.17.1" }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "fs"] }
