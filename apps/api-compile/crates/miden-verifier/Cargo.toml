[package]
name = "miden-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
miden-client = { version = "=0.18.2", features = ["tonic"] }
miden-client-sqlite-store = { version = "=0.18.2", package = "miden-client-sqlite-store" }
# `CallConv`, which `miden-client` does not re-export; pinned to the VM version it resolves.
miden-assembly-syntax = "=0.36.5"
miden-standards = { version = "=0.18.0" }
standard-components = { path = "../standard-components" }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
