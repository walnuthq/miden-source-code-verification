[package]
name = "miden-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
miden-client = { version = "0.16.0-alpha.1", features = ["tonic", "testing"] }
miden-client-sqlite-store = { version = "0.16.0-alpha.1", package = "miden-client-sqlite-store" }
miden-standards = { version = "0.16.0-alpha.5" }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.9" }
