[package]
name = "generate-fixtures"
version = "0.1.0"
edition = "2024"
# `src/bin/standard-fixtures.rs` is the second binary.
default-run = "generate-fixtures"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
miden-client = { version = "=0.18.2", features = ["tonic"] }
miden-client-sqlite-store = { version = "=0.18.2", package = "miden-client-sqlite-store" }
# Only the faucet's two `GET` endpoints are called, so the TLS stack is rustls
# and everything else is off. `miden-faucet-lib` would hand over the request
# types, but it pins its own `miden-client` and would duplicate it in the lock.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
rand = "0.10"
tempfile = "3.27"
miden-assemble = { path = "../miden-assemble" }
# For `standard-fixtures`, which builds its accounts and notes from the
# packages `miden-standards` ships. Pinned to the versions `miden-client`
# resolves, so they are the packages the other tools link.
miden-protocol = "=0.18.0"
miden-standards = "=0.18.0"
# For `standard-fixtures`, which reads the mirrored components workspace.
# Already in the lockfile through `miden-project`, at this version.
toml = "=1.1.8"
