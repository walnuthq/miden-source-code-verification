[package]
name = "generate-fixtures"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
miden-client = { version = "0.16.0-rc.1", features = ["tonic", "testing"] }
miden-client-sqlite-store = { version = "0.16.0-rc.1", package = "miden-client-sqlite-store" }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
rand = { version = "0.10" }
tempfile = "3"
