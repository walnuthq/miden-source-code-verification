[package]
name = "generate-fixtures"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
miden-client = { version = "0.16.0-rc.3", features = ["tonic", "testing"] }
miden-client-sqlite-store = { version = "0.16.0-rc.3", package = "miden-client-sqlite-store" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
rand = { version = "0.10.2" }
tempfile = "3.27.0"
